name: jellyfin_servarr_webdav

services:
  traefik:
    image: traefik:3.6
    container_name: traefik
    hostname: traefik
    restart: unless-stopped
    networks:
      - traefik
    command:
      - "--log.level=DEBUG"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      - "--entrypoints.websecure.http.tls.certresolver=letsencrypt"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${TLS_CERTIFICATE_MAIL:-example@domain.tld}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.caserver=${TLS_CERTIFICATE_SERVER:-https://acme-v02.api.letsencrypt.org/directory}"
    ports:
      - 80:80
      - 443:443
      - 8080:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${APP_BASE_DIR}/data/traefik/letsencrypt:/letsencrypt
  rclone:
    image: rclone/rclone:latest
    container_name: rclone
    hostname: rclone
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    security_opt:
      - apparmor:unconfined
    env_file:
      - .env
    volumes:
      - ${APP_BASE_DIR}/config/rclone.conf:/config/rclone/rclone.conf:ro
      - ${APP_BASE_DIR}/data/rclone/cache:/cache
      - type: bind
        source: ${APP_BASE_DIR}/mnt/webdav
        target: /mnt/webdav
        bind:
          propagation: rshared
    command: >
      mount jellyfin-webdav:${WEBDAV_PATH}
      /mnt/webdav
      --cache-dir /cache
      --dir-cache-time ${WEBDAV_REFRESH_INTERVAL:-60}s
      --vfs-cache-mode ${WEBDAV_VFS_CACHE_MODE:-full}
      --vfs-cache-max-size ${WEBDAV_VFS_CACHE_MAX_SIZE:-10G}
      --vfs-cache-max-age ${WEBDAV_VFS_CACHE_MAX_AGE:-1h}
      --vfs-read-chunk-size ${WEBDAV_VFS_READ_CHUNK_SIZE:-32M}
      --vfs-read-chunk-size-limit ${WEBDAV_VFS_READ_CHUNK_SIZE_LIMIT:-512M}
      --buffer-size ${WEBDAV_BUFFER_SIZE:-8M}
      --multi-thread-streams ${WEBDAV_MULTI_THREAD_STREAMS:-4}
      --cutoff-mode=${WEBDAV_CUTOFF_MODE:-hard}
      --network-mode
      --allow-other
      --allow-non-empty
      --rc
      --rc-no-auth
      --rc-addr :5572
    healthcheck:
      test: ["CMD", "rclone", "rc", "vfs/stats"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - traefik
  media-sync:
    image: bash:alpine3.21
    container_name: media-sync
    hostname: media-sync
    restart: unless-stopped
    depends_on:
      rclone:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./services/media-sync/media-sync.sh:/media-sync.sh:ro
      - ${APP_BASE_DIR}/mnt/webdav:/mnt/webdav:ro
      - ${APP_BASE_DIR}/mnt/medias:/mnt/medias
    command: ["/bin/bash", "/media-sync.sh"]
    networks:
      - traefik
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:10.10.7
    container_name: jellyfin
    hostname: jellyfin
    restart: unless-stopped
    depends_on:
      rclone:
        condition: service_healthy
    networks:
      - traefik
    ports:
      - 8096:8096
      - 8920:8920
      - 7359:7359/udp
    env_file:
      - .env
    volumes:
      - ${APP_BASE_DIR}/data/jellyfin/config:/config
      - ${APP_BASE_DIR}/mnt/webdav:/mnt/webdav
      - ${APP_BASE_DIR}/mnt/medias:/medias
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.${TRAEFIK_HOST}`)"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
  homer:
    image: b4bz/homer:v25.05.2
    container_name: homer
    hostname: homer
    restart: unless-stopped
    entrypoint: /replace-urls.sh
    networks:
      - traefik
    ports:
      - 8282:8080
    env_file:
      - .env
    environment:
      - INIT_ASSETS=0
    volumes:
      - ./services/homer/assets:/www/assets
      - ./services/homer/entrypoint.sh:/replace-urls.sh
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homer.rule=Host(`homer.${TRAEFIK_HOST}`)"
      - "traefik.http.services.homer.loadbalancer.server.port=8080"
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:1.37.0
    container_name: prowlarr
    hostname: prowlarr
    restart: unless-stopped
    networks:
      - traefik
    ports:
      - 9696:9696
    volumes:
      - ${APP_BASE_DIR}/data/prowlarr/config:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.${TRAEFIK_HOST}`)"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
  rdtclient:
    image: rogerfar/rdtclient:2.0.113
    container_name: rdtclient
    hostname: rdtclient
    restart: unless-stopped
    depends_on:
      rclone:
        condition: service_healthy
    networks:
      - traefik
    ports:
      - 6500:6500
    env_file:
      - .env
    volumes:
      - ${APP_BASE_DIR}/data/rdtclient/db:/data/db
      - ${APP_BASE_DIR}/data/rdtclient/downloads:/downloads
      - ${APP_BASE_DIR}/mnt/webdav:/mnt/webdav
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6500"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rdtclient.rule=Host(`rdtclient.${TRAEFIK_HOST}`)"
      - "traefik.http.services.rdtclient.loadbalancer.server.port=6500"
  radarr:
    image: lscr.io/linuxserver/radarr:5.25.0
    container_name: radarr
    hostname: radarr
    restart: unless-stopped
    depends_on:
      prowlarr:
        condition: service_healthy
      rdtclient:
        condition: service_healthy
      rclone:
        condition: service_healthy
    networks:
      - traefik
    ports:
      - 7878:7878
    env_file:
      - .env
    volumes:
      - ${APP_BASE_DIR}/data/radarr/config:/config
      - ${APP_BASE_DIR}/data/rdtclient/downloads:/downloads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.${TRAEFIK_HOST}`)"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.14
    container_name: sonarr
    hostname: sonarr
    restart: unless-stopped
    depends_on:
      prowlarr:
        condition: service_healthy
      rdtclient:
        condition: service_healthy
      rclone:
        condition: service_healthy
    networks:
      - traefik
    ports:
      - 8989:8989
    env_file:
      - .env
    volumes:
      - ${APP_BASE_DIR}/data/sonarr/config:/config
      - ${APP_BASE_DIR}/data/rdtclient/downloads:/downloads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.${TRAEFIK_HOST}`)"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
  jellyseerr:
    image: fallenbagel/jellyseerr:2.5.2
    container_name: jellyseerr
    hostname: jellyseerr
    restart: unless-stopped
    networks:
      - traefik
    depends_on:
      radarr:
        condition: service_healthy
      sonarr:
        condition: service_healthy
    ports:
      - 5055:5055
    env_file:
      - .env
    volumes:
      - ${APP_BASE_DIR}/data/jellyseerr/config:/app/config
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5055/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyseerr.rule=Host(`jellyseerr.${TRAEFIK_HOST}`)"
      - "traefik.http.services.jellyseerr.loadbalancer.server.port=5055"
  tautulli:
    image: lscr.io/linuxserver/tautulli:2.15.2
    container_name: tautulli
    hostname: tautulli
    restart: unless-stopped
    networks:
      - traefik
    depends_on:
      jellyfin:
        condition: service_healthy
    ports:
      - 8181:8181
    env_file:
      - .env
    volumes:
      - ${APP_BASE_DIR}/data/tautulli/config:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tautulli.rule=Host(`tautulli.${TRAEFIK_HOST}`)"
      - "traefik.http.services.tautulli.loadbalancer.server.port=8181"

networks:
  traefik:
    name: traefik
