name: plex_servarr_webdav

services:
  traefik:
    image: traefik:v3.4
    container_name: traefik
    hostname: traefik
    restart: unless-stopped
    networks:
      - traefik
    command:
      - "--log.level=DEBUG"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      - "--entrypoints.websecure.http.tls.certresolver=letsencrypt"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${TLS_CERTIFICATE_MAIL:-example@domain.tld}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.caserver=${TLS_CERTIFICATE_SERVER:-https://acme-v02.api.letsencrypt.org/directory}"
    ports:
      - 80:80
      - 443:443
      - 8080:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/traefik/letsencrypt:/letsencrypt
  plex:
    image: registry.gitlab.com/alexandrevassard1/plex-servarr-webdav/test:latest
    container_name: plex
    hostname: plex
    restart: unless-stopped
    networks:
      - traefik
    ports:
      - 32400:32400
      - 3005:3005
      - 8324:8324
      - 32469:32469
      - 1900:1900/udp
      - 32410:32410/udp
      - 32412:32412/udp
      - 32413:32413/udp
      - 32414:32414/udp
      - 5353:5353/udp
    env_file:
      - .env
    volumes:
      - ./data/plex/config:/config
      - /mnt/plex-webdav:/mnt/plex-webdav
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:32400/web"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plex.rule=Host(`plex.${TRAEFIK_HOST}`)"
      - "traefik.http.services.plex.loadbalancer.server.port=32400"
  homer:
    image: b4bz/homer:v25.05.2
    container_name: homer
    hostname: homer
    restart: unless-stopped
    entrypoint: /replace-urls.sh
    networks:
      - traefik
    ports:
      - 8282:8080
    env_file:
      - .env
    environment:
      - INIT_ASSETS=0
    volumes:
      - ./homer/assets:/www/assets
      - ./homer/entrypoint.sh:/replace-urls.sh
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homer.rule=Host(`homer.${TRAEFIK_HOST}`)"
      - "traefik.http.services.homer.loadbalancer.server.port=8080"
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.3.24
    container_name: flaresolverr
    hostname: flaresolverr
    restart: unless-stopped
    networks:
      - traefik
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
    ports:
      - 8191:8191
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:1.37.0
    container_name: prowlarr
    hostname: prowlarr
    restart: unless-stopped
    networks:
      - traefik
    entrypoint: /usr/local/bin/entrypoint.sh
    ports:
      - 9696:9696
    volumes:
      - ./prowlarr/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - ./data/prowlarr/config:/config
      - ./prowlarr/definitions:/default/Definitions/Custom
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.${TRAEFIK_HOST}`)"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
  rdtclient:
    image: rogerfar/rdtclient:2.0.113
    container_name: rdtclient
    hostname: rdtclient
    restart: unless-stopped
    networks:
      - traefik
    ports:
      - 6500:6500
    env_file:
      - .env
    volumes:
      - ./data/rdtclient/db:/data/db
      - ./data/rdtclient/downloads:/data/downloads
      - /mnt/plex-webdav:/mnt/plex-webdav
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6500"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rdtclient.rule=Host(`rdtclient.${TRAEFIK_HOST}`)"
      - "traefik.http.services.rdtclient.loadbalancer.server.port=6500"
  radarr:
    image: lscr.io/linuxserver/radarr:5.25.0
    container_name: radarr
    hostname: radarr
    restart: unless-stopped
    depends_on:
      prowlarr:
        condition: service_healthy
      rdtclient:
        condition: service_healthy
    networks:
      - traefik
    ports:
      - 7878:7878
    env_file:
      - .env
    volumes:
      - ./data/radarr/config:/config
      - ./data/rdtclient/downloads:/downloads
      - /mnt/plex-webdav:/mnt/plex-webdav
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.${TRAEFIK_HOST}`)"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.14
    container_name: sonarr
    hostname: sonarr
    restart: unless-stopped
    networks:
      - traefik
    depends_on:
      prowlarr:
        condition: service_healthy
      rdtclient:
        condition: service_healthy
    ports:
      - 8989:8989
    env_file:
      - .env
    volumes:
      - ./data/sonarr/config:/config
      - ./data/rdtclient/downloads:/downloads
      - /mnt/plex-webdav:/mnt/plex-webdav
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.${TRAEFIK_HOST}`)"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
  jellyseerr:
    image: fallenbagel/jellyseerr:2.5.2
    container_name: jellyseerr
    hostname: jellyseerr
    restart: unless-stopped
    networks:
      - traefik
    depends_on:
      radarr:
        condition: service_healthy
      sonarr:
        condition: service_healthy
    ports:
      - 5055:5055
    env_file:
      - .env
    volumes:
      - ./data/jellyseerr/config:/app/config
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5055/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyseerr.rule=Host(`jellyseerr.${TRAEFIK_HOST}`)"
      - "traefik.http.services.jellyseerr.loadbalancer.server.port=5055"
  tautulli:
    image: lscr.io/linuxserver/tautulli:2.15.2
    container_name: tautulli
    hostname: tautulli
    restart: unless-stopped
    networks:
      - traefik
    depends_on:
      plex:
        condition: service_healthy
    ports:
      - 8181:8181
    env_file:
      - .env
    volumes:
      - ./data/tautulli/config:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tautulli.rule=Host(`tautulli.${TRAEFIK_HOST}`)"
      - "traefik.http.services.tautulli.loadbalancer.server.port=8181"

networks:
  traefik:
    name: traefik
