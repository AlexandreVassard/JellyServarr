name: jellyfin_servarr_webdav

services:
  traefik:
    image: traefik:3.6
    container_name: traefik
    hostname: traefik
    restart: unless-stopped
    networks:
      - traefik
    command:
      - "--log.level=DEBUG"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      - "--entrypoints.websecure.http.tls.certresolver=letsencrypt"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${TLS_CERTIFICATE_MAIL:-example@domain.tld}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.caserver=${TLS_CERTIFICATE_SERVER:-https://acme-v02.api.letsencrypt.org/directory}"
    ports:
      - 80:80
      - 443:443
      - 8080:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${APP_BASE_DIR}/data/traefik/letsencrypt:/letsencrypt
  rclone:
    image: rclone/rclone:latest
    container_name: rclone
    hostname: rclone
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    security_opt:
      - apparmor:unconfined
    env_file:
      - .env
    volumes:
      - ${APP_BASE_DIR}/config/rclone.conf:/config/rclone/rclone.conf:ro
      - ${APP_BASE_DIR}/data/rclone/cache:/cache
      - type: bind
        source: ${APP_BASE_DIR}/mnt/webdav
        target: /mnt/webdav
        bind:
          propagation: rshared
    command: >
      mount jellyfin-webdav:${WEBDAV_PATH}
      /mnt/webdav
      --cache-dir /cache
      --dir-cache-time ${WEBDAV_REFRESH_INTERVAL:-60}s
      --vfs-cache-mode ${WEBDAV_VFS_CACHE_MODE:-full}
      --vfs-cache-max-size ${WEBDAV_VFS_CACHE_MAX_SIZE:-10G}
      --vfs-cache-max-age ${WEBDAV_VFS_CACHE_MAX_AGE:-1h}
      --vfs-read-chunk-size ${WEBDAV_VFS_READ_CHUNK_SIZE:-32M}
      --vfs-read-chunk-size-limit ${WEBDAV_VFS_READ_CHUNK_SIZE_LIMIT:-512M}
      --buffer-size ${WEBDAV_BUFFER_SIZE:-8M}
      --multi-thread-streams ${WEBDAV_MULTI_THREAD_STREAMS:-4}
      --cutoff-mode=${WEBDAV_CUTOFF_MODE:-hard}
      --network-mode
      --allow-other
      --allow-non-empty
      --rc
      --rc-no-auth
      --rc-addr :5572
    healthcheck:
      test: ["CMD", "rclone", "rc", "vfs/stats"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - traefik
  media-sync:
    image: bash:alpine3.21
    container_name: media-sync
    hostname: media-sync
    restart: unless-stopped
    depends_on:
      rclone:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./services/media-sync/media-sync.sh:/media-sync.sh:ro
      - ${APP_BASE_DIR}/mnt/webdav:/mnt/webdav:ro
      - ${APP_BASE_DIR}/mnt/medias:/mnt/medias
    command: ["/usr/local/bin/bash", "/media-sync.sh"]
    networks:
      - traefik
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:10.10.7
    container_name: jellyfin
    hostname: jellyfin
    restart: unless-stopped
    depends_on:
      rclone:
        condition: service_healthy
    networks:
      - traefik
    ports:
      - 8096:8096
      - 8920:8920
      - 7359:7359/udp
    env_file:
      - .env
    volumes:
      - ${APP_BASE_DIR}/data/jellyfin/config:/config
      - ${APP_BASE_DIR}/mnt/webdav:/mnt/webdav
      - ${APP_BASE_DIR}/mnt/medias:/medias
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.${TRAEFIK_HOST}`)"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
  jellyseerr:
    image: fallenbagel/jellyseerr:2.5.2
    container_name: jellyseerr
    hostname: jellyseerr
    restart: unless-stopped
    networks:
      - traefik
    depends_on:
      jellyfin:
        condition: service_healthy
    ports:
      - 5055:5055
    env_file:
      - .env
    volumes:
      - ${APP_BASE_DIR}/data/jellyseerr/config:/app/config
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5055/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyseerr.rule=Host(`jellyseerr.${TRAEFIK_HOST}`)"
      - "traefik.http.services.jellyseerr.loadbalancer.server.port=5055"

networks:
  traefik:
    name: traefik
